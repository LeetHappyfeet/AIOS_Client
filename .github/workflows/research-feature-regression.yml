name: Research feature regression

on:
  push:
    branches:
      - feature/hybrid-research-discovery-v1
      - feature/calibre-synthesis-recovery-v2
    paths:
      - 'src/aios_client/**'
      - 'tests/test_research_*.py'
      - 'tests/test_journal_expired_lease_recovery.py'
      - 'pyproject.toml'
      - '.github/workflows/research-feature-regression.yml'
  pull_request:
    paths:
      - 'src/aios_client/**'
      - 'tests/test_research_*.py'
      - 'tests/test_journal_expired_lease_recovery.py'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run research regression tests
        run: |
          python -m pytest -q \
            tests/test_research_execution_control.py \
            tests/test_research_report_finalization.py \
            tests/test_journal_expired_lease_recovery.py \
            tests/test_research_source_setup.py
