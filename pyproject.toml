[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aios-client"
version = "0.1.0"
description = "Configurable AIOS workspace client"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "regex>=2024.5.15", "httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "keyring>=25,<26"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
aios-client = "aios_client.cli:main"

[tool.setuptools.package-data]
aios_client = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
